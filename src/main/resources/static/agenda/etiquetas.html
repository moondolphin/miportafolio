<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Mislun — Etiquetas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { background:#f7f0ff; color:#3b1f6a; font-family:'Inter',sans-serif; }
        h1,h2 { font-family:'Cormorant Garamond',serif; }
        .card { background:white; border:1px solid #e9d5ff; border-radius:1rem; padding:1.25rem; }
        .input-field { border:1px solid #e9d5ff; border-radius:.5rem; padding:.55rem .85rem; width:100%; font-size:.85rem; outline:none; background:#fdfbff; color:#3b1f6a; }
        .input-field:focus { border-color:#8b5cf6; }
        .btn-primary { background:#8b5cf6; color:white; padding:.55rem 1.25rem; border-radius:.65rem; font-size:.85rem; cursor:pointer; }
        .btn-danger  { background:#fee2e2; color:#b91c1c; padding:.35rem .75rem; border-radius:.5rem; font-size:.7rem; cursor:pointer; }
        .btn-secondary { border:1px solid #e9d5ff; color:#7c6a94; padding:.35rem .75rem; border-radius:.5rem; font-size:.7rem; cursor:pointer; }
        .badge { display:inline-block; padding:.2rem .65rem; border-radius:999px; font-size:.75rem; font-weight:500; }
    </style>
</head>
<body>
<header class="bg-white border-b sticky top-0 z-10" style="border-color:#e9d5ff;">
    <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="/agenda/dashboard.html" class="text-sm" style="color:#7c6a94;">← Dashboard</a>
            <h1 class="text-xl font-bold" style="color:#8b5cf6;">🏷 Etiquetas</h1>
        </div>
        <button onclick="logout()" class="text-xs px-3 py-1.5 rounded-lg" style="border:1px solid #e9d5ff; color:#7c6a94;">Salir</button>
    </div>
</header>
<div class="max-w-3xl mx-auto px-4 py-6 grid md:grid-cols-2 gap-6">
    <div class="card">
        <h2 class="text-lg font-semibold mb-4" id="form-title">Nueva etiqueta</h2>
        <form id="form-etiqueta" onsubmit="guardar(event)" class="space-y-3">
            <input type="hidden" id="etiqueta-id">
            <div>
                <label class="block text-xs mb-1" style="color:#7c6a94;">Nombre *</label>
                <input id="etiqueta-nombre" class="input-field" required>
            </div>
            <div>
                <label class="block text-xs mb-1" style="color:#7c6a94;">Color (hex, p.ej. #ede9fe)</label>
                <div class="flex gap-2 items-center">
                    <input id="etiqueta-color" type="color" value="#ede9fe" style="width:2.5rem; height:2.5rem; border:none; border-radius:.5rem; cursor:pointer;">
                    <input id="etiqueta-color-text" type="text" class="input-field" value="#ede9fe" maxlength="7" placeholder="#ede9fe" oninput="syncColor(this)">
                </div>
            </div>
            <p id="form-error" class="text-xs text-red-500 hidden"></p>
            <div class="flex gap-2">
                <button type="submit" class="btn-primary flex-1">Guardar</button>
                <button type="button" onclick="resetForm()" class="btn-secondary">Limpiar</button>
            </div>
        </form>

        <!-- Previsualización -->
        <div class="mt-4">
            <p class="text-xs mb-2" style="color:#7c6a94;">Vista previa:</p>
            <span id="preview-badge" class="badge" style="background:#ede9fe; color:#3b1f6a;">etiqueta</span>
        </div>
    </div>

    <div class="card">
        <h2 class="text-lg font-semibold mb-3">Etiquetas creadas</h2>
        <div id="lista-etiquetas" class="space-y-2">
            <p class="text-xs" style="color:#7c6a94;">Cargando...</p>
        </div>
    </div>
</div>
<script src="/agenda/js/api.js"></script>
<script>
requireAuth();
cargarEtiquetas();

// Sync color picker ↔ text input
document.getElementById('etiqueta-color').addEventListener('input', function() {
    document.getElementById('etiqueta-color-text').value = this.value;
    actualizarPreview();
});
document.getElementById('etiqueta-color-text').addEventListener('input', function() {
    if (/^#[0-9A-Fa-f]{6}$/.test(this.value)) {
        document.getElementById('etiqueta-color').value = this.value;
    }
    actualizarPreview();
});
document.getElementById('etiqueta-nombre').addEventListener('input', actualizarPreview);

function syncColor(input) { actualizarPreview(); }

function actualizarPreview() {
    const color  = document.getElementById('etiqueta-color-text').value || '#ede9fe';
    const nombre = document.getElementById('etiqueta-nombre').value || 'etiqueta';
    const badge  = document.getElementById('preview-badge');
    badge.style.background = color;
    badge.textContent = nombre;
}

async function cargarEtiquetas() {
    const container = document.getElementById('lista-etiquetas');
    try {
        const etiquetas = await apiGet('/admin/etiquetas');
        if (!etiquetas.length) { container.innerHTML = '<p class="text-xs" style="color:#7c6a94;">Sin etiquetas aún.</p>'; return; }
        container.innerHTML = etiquetas.map(e => `
            <div class="flex items-center justify-between">
                <span class="badge" style="background:${e.color||'#ede9fe'}; color:#3b1f6a;">${e.nombre}</span>
                <div class="flex gap-1">
                    <button onclick='editarEtiqueta(${JSON.stringify(e)})'  class="btn-secondary">✏</button>
                    <button onclick="eliminarEtiqueta(${e.id})" class="btn-danger">✕</button>
                </div>
            </div>`).join('');
    } catch (e) { container.innerHTML = `<p class="text-xs text-red-400">Error: ${e.message}</p>`; }
}

async function guardar(e) {
    e.preventDefault();
    ocultarError('form-error');
    const id = document.getElementById('etiqueta-id').value;
    const body = {
        nombre: document.getElementById('etiqueta-nombre').value,
        color:  document.getElementById('etiqueta-color-text').value || null
    };
    try {
        if (id) await apiPut('/admin/etiquetas/' + id, body);
        else    await apiPost('/admin/etiquetas', body);
        resetForm();
        cargarEtiquetas();
    } catch (err) { mostrarError('form-error', err.message); }
}

function editarEtiqueta(e) {
    document.getElementById('etiqueta-id').value           = e.id;
    document.getElementById('etiqueta-nombre').value       = e.nombre;
    document.getElementById('etiqueta-color').value        = e.color || '#ede9fe';
    document.getElementById('etiqueta-color-text').value   = e.color || '#ede9fe';
    document.getElementById('form-title').textContent = 'Editar etiqueta';
    actualizarPreview();
}

async function eliminarEtiqueta(id) {
    if (!confirm('¿Eliminar esta etiqueta?')) return;
    try { await apiDelete('/admin/etiquetas/' + id); cargarEtiquetas(); }
    catch (e) { alert('Error: ' + e.message); }
}

function resetForm() {
    document.getElementById('form-etiqueta').reset();
    document.getElementById('etiqueta-id').value = '';
    document.getElementById('etiqueta-color').value = '#ede9fe';
    document.getElementById('etiqueta-color-text').value = '#ede9fe';
    document.getElementById('form-title').textContent = 'Nueva etiqueta';
    ocultarError('form-error');
    actualizarPreview();
}
</script>
</body>
</html>
