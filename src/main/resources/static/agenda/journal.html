<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Mislun — Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#f0f9ff; --primary:#8b5cf6; --text:#3b1f6a; --text-soft:#7c6a94; --border:#bae6fd; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
        h1,h2,h3 { font-family:'Cormorant Garamond',serif; }
        .card { background:white; border:1px solid var(--border); border-radius:1rem; padding:1.25rem; }
        .input-field { border:1px solid #e9d5ff; border-radius:.5rem; padding:.55rem .85rem; width:100%; font-size:.85rem; outline:none; background:#fdfbff; color:var(--text); }
        .input-field:focus { border-color:var(--primary); }
        .btn-primary { background:var(--primary); color:white; padding:.55rem 1.25rem; border-radius:.65rem; font-size:.85rem; cursor:pointer; }
        .btn-danger  { background:#fee2e2; color:#b91c1c; padding:.4rem .85rem; border-radius:.65rem; font-size:.75rem; cursor:pointer; }
        .btn-secondary { border:1px solid #e9d5ff; color:var(--text-soft); padding:.4rem .85rem; border-radius:.65rem; font-size:.75rem; cursor:pointer; }
        .badge { display:inline-block; padding:.1rem .5rem; border-radius:999px; font-size:.65rem; font-weight:500; }
        .entry-card { background:white; border:1px solid var(--border); border-radius:.85rem; padding:1rem; margin-bottom:.5rem; }
    </style>
</head>
<body>
<header class="bg-white border-b sticky top-0 z-10" style="border-color:#bae6fd;">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="/agenda/dashboard.html" class="text-sm" style="color:var(--text-soft);">← Dashboard</a>
            <h1 class="text-xl font-bold" style="color:var(--primary);">📖 Journal</h1>
        </div>
        <button onclick="logout()" class="text-xs px-3 py-1.5 rounded-lg" style="border:1px solid #e9d5ff; color:var(--text-soft);">Salir</button>
    </div>
</header>
<div class="max-w-5xl mx-auto px-4 py-6 grid md:grid-cols-3 gap-6">
    <div class="card md:col-span-1">
        <h2 class="text-lg font-semibold mb-4" id="form-title">Nueva entrada</h2>
        <form id="form-journal" onsubmit="guardarEntry(event)" class="space-y-3">
            <input type="hidden" id="entry-id">
            <div>
                <label class="block text-xs mb-1" style="color:var(--text-soft);">Título (opcional)</label>
                <input id="entry-titulo" class="input-field">
            </div>
            <div>
                <label class="block text-xs mb-1" style="color:var(--text-soft);">Contenido *</label>
                <textarea id="entry-contenido" class="input-field" rows="7" required></textarea>
            </div>
            <div>
                <label class="block text-xs mb-1" style="color:var(--text-soft);">Fecha</label>
                <input id="entry-fecha" type="date" class="input-field">
            </div>
            <div>
                <label class="block text-xs mb-1" style="color:var(--text-soft);">Etiquetas</label>
                <div id="etiquetas-checks" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto"></div>
            </div>
            <p id="form-error" class="text-xs text-red-500 hidden"></p>
            <div class="flex gap-2">
                <button type="submit" class="btn-primary flex-1">Guardar</button>
                <button type="button" onclick="resetForm()" class="btn-secondary">Limpiar</button>
            </div>
        </form>
    </div>
    <div class="md:col-span-2" id="lista-journal">
        <p class="text-sm" style="color:var(--text-soft);">Cargando...</p>
    </div>
</div>
<script src="/agenda/js/api.js"></script>
<script>
requireAuth();
cargarEtiquetasForm();
cargarJournal();
document.getElementById('entry-fecha').value = fechaHoy();

async function cargarEtiquetasForm() {
    try {
        const etiquetas = await apiGet('/admin/etiquetas');
        document.getElementById('etiquetas-checks').innerHTML = etiquetas.map(e => `
            <label class="flex items-center gap-1 text-xs cursor-pointer">
                <input type="checkbox" value="${e.id}" class="etiqueta-check">
                <span class="badge" style="background:${e.color||'#ede9fe'}; color:#3b1f6a;">${e.nombre}</span>
            </label>`).join('');
    } catch {}
}

async function cargarJournal() {
    const container = document.getElementById('lista-journal');
    try {
        const entradas = await apiGet('/admin/journal');
        if (!entradas.length) { container.innerHTML = '<p class="text-sm" style="color:var(--text-soft);">Sin entradas aún.</p>'; return; }
        container.innerHTML = entradas.reverse().map(j => `
            <div class="entry-card">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <p class="font-medium text-sm">${j.titulo || '—'}</p>
                        <p class="text-xs" style="color:var(--text-soft);">${formatearFecha(j.fechaReferencia)}</p>
                    </div>
                    <div class="flex gap-1">
                        <button onclick='editarEntry(${JSON.stringify(j).replace(/'/g,"\\'")})'  class="btn-secondary">✏</button>
                        <button onclick="eliminarEntry(${j.id})" class="btn-danger">✕</button>
                    </div>
                </div>
                <p class="text-sm whitespace-pre-wrap italic" style="color:#4b3a6b;">"${j.contenido}"</p>
                <div class="flex gap-1 mt-2 flex-wrap">
                    ${(j.etiquetas||[]).map(e=>`<span class="badge" style="background:${e.color||'#ede9fe'};color:#3b1f6a;">${e.nombre}</span>`).join('')}
                </div>
            </div>`).join('');
    } catch (e) { container.innerHTML = `<p class="text-sm text-red-400">Error: ${e.message}</p>`; }
}

async function guardarEntry(e) {
    e.preventDefault();
    ocultarError('form-error');
    const id = document.getElementById('entry-id').value;
    const etiquetaIds = [...document.querySelectorAll('.etiqueta-check:checked')].map(c => parseInt(c.value));
    const body = {
        titulo:          document.getElementById('entry-titulo').value || null,
        contenido:       document.getElementById('entry-contenido').value,
        fechaReferencia: document.getElementById('entry-fecha').value || null,
        etiquetaIds
    };
    try {
        if (id) await apiPut('/admin/journal/' + id, body);
        else    await apiPost('/admin/journal', body);
        resetForm();
        cargarJournal();
    } catch (err) { mostrarError('form-error', err.message); }
}

function editarEntry(j) {
    document.getElementById('entry-id').value        = j.id;
    document.getElementById('entry-titulo').value    = j.titulo || '';
    document.getElementById('entry-contenido').value = j.contenido;
    document.getElementById('entry-fecha').value     = j.fechaReferencia || '';
    document.getElementById('form-title').textContent = 'Editar entrada';
    const ids = (j.etiquetas || []).map(e => e.id);
    document.querySelectorAll('.etiqueta-check').forEach(c => { c.checked = ids.includes(parseInt(c.value)); });
    window.scrollTo(0,0);
}

async function eliminarEntry(id) {
    if (!confirm('¿Eliminar esta entrada?')) return;
    try { await apiDelete('/admin/journal/' + id); cargarJournal(); }
    catch (e) { alert('Error: ' + e.message); }
}

function resetForm() {
    document.getElementById('form-journal').reset();
    document.getElementById('entry-id').value = '';
    document.getElementById('form-title').textContent = 'Nueva entrada';
    document.getElementById('entry-fecha').value = fechaHoy();
    document.querySelectorAll('.etiqueta-check').forEach(c => c.checked = false);
    ocultarError('form-error');
}
</script>
</body>
</html>
