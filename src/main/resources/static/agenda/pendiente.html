<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Mislun — Acceso pendiente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f7f0ff; color: #3b1f6a; font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'Cormorant Garamond', serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="text-center max-w-md">
        <div class="text-6xl mb-6">🌙</div>
        <h1 class="text-3xl font-bold mb-3" style="color:#8b5cf6;">Acceso pendiente</h1>
        <p class="text-sm mb-6" style="color:#7c6a94;">
            Tu cuenta fue registrada correctamente.<br>
            Estás esperando aprobación para acceder al módulo.
        </p>
        <p class="text-xs mb-8" style="color:#a089b8;">
            Una vez que la administradora habilite tu cuenta, podrás ingresar con normalidad.
        </p>
        <div class="flex gap-3 justify-center">
            <a href="/agenda/login.html" class="px-5 py-2 rounded-xl text-sm font-medium text-white" style="background:#8b5cf6;">
                Volver al login
            </a>
            <a href="/Home.html" class="px-5 py-2 rounded-xl text-sm font-medium" style="border:1px solid #e9d5ff; color:#7c6a94;">
                Portafolio
            </a>
        </div>
    </div>

</html>
